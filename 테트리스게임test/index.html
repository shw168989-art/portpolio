<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 대시보드 게임</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2a2a35;
            --text-color: #ffffff;
            --text-muted: #a0a0b0;
            --accent-color: #47a7f5;
            --grid-color: #3a3a4a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 대시보드 컨테이너 */
        .dashboard {
            display: grid;
            grid-template-columns: 250px 340px;
            grid-gap: 20px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 왼쪽 사이드바 (스코어 및 정보) */
        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .brand p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0 0 25px 0;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* 다음 블록 미리보기 */
        .next-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .next-canvas-wrapper {
            margin-top: 10px;
            background: #111;
            padding: 5px;
            border-radius: 4px;
        }

        /* 조작법 안내 */
        .controls-info {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 6px;
        }

        /* 오른쪽 메인 게임 보드 */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas#tetris {
            background: #111;
            border: 4px solid var(--grid-color);
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .btn-play {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-play:hover {
            background: #3592e0;
        }

        .btn-play:focus {
            outline: none;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="sidebar">
            <div class="top-section">
                <div class="brand">
                    <h1>TETRIS</h1>
                    <p>Dashboard Edition</p>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Lines</div>
                    <div class="stat-value" id="lines">0</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Level</div>
                    <div class="stat-value" id="level">1</div>
                </div>

                <div class="next-box">
                    <div class="stat-label">Next Piece</div>
                    <div class="next-canvas-wrapper">
                        <canvas id="next" width="96" height="96"></canvas>
                    </div>
                </div>
            </div>

            <div class="controls-info">
                <strong>[조작 방법]</strong><br>
                ← / → : 좌우 이동<br>
                ↑ : 블록 회전<br>
                ↓ : 소프트 드롭 (빨리 내리기)<br>
                Space : 하드 드롭 (바로 내리기)
            </div>
        </div>

        <div class="game-area">
            <canvas id="tetris" width="240" height="480"></canvas>
            <button class="btn-play" id="start-btn">GAME START</button>
        </div>
    </div>

    <script>
        // DOM이 확실히 로드된 후 스크립트 실행
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('tetris');
            const context = canvas.getContext('2d');
            const nextCanvas = document.getElementById('next');
            const nextContext = nextCanvas.getContext('2d');

            context.scale(24, 24);
            nextContext.scale(24, 24);

            const colors = [
                null,
                '#FF0D72', // T
                '#0DC2FF', // I
                '#0DFF72', // S
                '#F538FF', // Z
                '#FF8E0D', // L
                '#FFE138', // J
                '#3877FF'  // O
            ];

            function createMatrix(w, h) {
                const matrix = [];
                while (h--) {
                    matrix.push(new Array(w).fill(0));
                }
                return matrix;
            }

            function createPiece(type) {
                if (type === 'I') {
                    return [
                        [0, 1, 0, 0],
                        [0, 1, 0, 0],
                        [0, 1, 0, 0],
                        [0, 1, 0, 0],
                    ];
                } else if (type === 'L') {
                    return [
                        [0, 2, 0],
                        [0, 2, 0],
                        [0, 2, 2],
                    ];
                } else if (type === 'J') {
                    return [
                        [0, 3, 0],
                        [0, 3, 0],
                        [3, 3, 0],
                    ];
                } else if (type === 'O') {
                    return [
                        [4, 4],
                        [4, 4],
                    ];
                } else if (type === 'Z') {
                    return [
                        [5, 5, 0],
                        [0, 5, 5],
                        [0, 0, 0],
                    ];
                } else if (type === 'S') {
                    return [
                        [0, 6, 6],
                        [6, 6, 0],
                        [0, 0, 0],
                    ];
                } else if (type === 'T') {
                    return [
                        [0, 7, 0],
                        [7, 7, 7],
                        [0, 0, 0],
                    ];
                }
            }

            function draw() {
                context.fillStyle = '#111';
                context.fillRect(0, 0, canvas.width, canvas.height);

                context.strokeStyle = '#222';
                context.lineWidth = 0.05;
                for(let i=0; i<10; i++) {
                    context.beginPath(); context.moveTo(i, 0); context.lineTo(i, 20); context.stroke();
                }
                for(let j=0; j<20; j++) {
                    context.beginPath(); context.moveTo(0, j); context.lineTo(10, j); context.stroke();
                }

                drawMatrix(arena, {x: 0, y: 0}, context);
                drawMatrix(player.matrix, player.pos, context);
            }

            function drawNext() {
                nextContext.fillStyle = '#111';
                nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
                if (player.next) {
                    drawMatrix(player.next, {x: 1, y: 1}, nextContext);
                }
            }

            function drawMatrix(matrix, offset, ctx) {
                if (!matrix) return;
                matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            ctx.fillStyle = colors[value];
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                            ctx.lineWidth = 0.08;
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        }
                    });
                });
            }

            function collide(arena, player) {
                const [m, o] = [player.matrix, player.pos];
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < m[y].length; ++x) {
                        if (m[y][x] !== 0 &&
                           (arena[y + o.y] === undefined ||
                            arena[y + o.y][x + o.x] === undefined ||
                            arena[y + o.y][x + o.x] !== 0)) {
                            return true;
                        }
                    }
                }
                return false;
            }

            function merge(arena, player) {
                player.matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            arena[y + player.pos.y][x + player.pos.x] = value;
                        }
                    });
                });
            }

            function arenaSweep() {
                let rowCount = 1;
                outer: for (let y = arena.length - 1; y > 0; --y) {
                    for (let x = 0; x < arena[y].length; ++x) {
                        if (arena[y][x] === 0) {
                            continue outer;
                        }
                    }
                    const row = arena.splice(y, 1)[0].fill(0);
                    arena.unshift(row);
                    ++y;

                    player.score += rowCount * 10;
                    player.lines += 1;
                    rowCount *= 2;

                    player.level = Math.floor(player.lines / 10) + 1;
                    dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                }
            }

            function playerDrop() {
                if (gameOver) return;
                player.pos.y++;
                if (collide(arena, player)) {
                    player.pos.y--;
                    merge(arena, player);
                    playerReset();
                    arenaSweep();
                    updateScore();
                }
                dropCounter = 0;
            }

            function playerHardDrop() {
                if (gameOver) return;
                while (!collide(arena, player)) {
                    player.pos.y++;
                }
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
                dropCounter = 0;
            }

            function playerMove(dir) {
                if (gameOver) return;
                player.pos.x += dir;
                if (collide(arena, player)) {
                    player.pos.x -= dir;
                }
            }

            const pieces = 'ILJZOST';
            function getRandomPiece() {
                return createPiece(pieces[pieces.length * Math.random() | 0]);
            }

            function playerReset() {
                if (!player.next) {
                    player.next = getRandomPiece();
                }
                player.matrix = player.next;
                player.next = getRandomPiece();
                player.pos.y = 0;
                player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

                if (collide(arena, player)) {
                    gameOver = true;
                    alert("GAME OVER! 최종 점수: " + player.score);
                    document.getElementById('start-btn').innerText = "RESTART GAME";
                }
                drawNext();
            }

            function playerRotate(dir) {
                if (gameOver) return;
                const pos = player.pos.x;
                let offset = 1;
                rotate(player.matrix, dir);
                while (collide(arena, player)) {
                    player.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > player.matrix[0].length) {
                        rotate(player.matrix, -dir);
                        player.pos.x = pos;
                        return;
                    }
                }
            }

            function rotate(matrix, dir) {
                for (let y = 0; y < matrix.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                    }
                }
                if (dir > 0) {
                    matrix.forEach(row => row.reverse());
                } else {
                    matrix.reverse();
                }
            }

            function updateScore() {
                document.getElementById('score').innerText = player.score;
                document.getElementById('lines').innerText = player.lines;
                document.getElementById('level').innerText = player.level;
            }

            let dropCounter = 0;
            let dropInterval = 1000;
            let lastTime = 0;
            let gameOver = true;

            function update(time = 0) {
                if (gameOver) return;

                const deltaTime = time - lastTime;
                lastTime = time;

                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }

                draw();
                requestAnimationFrame(update);
            }

            const arena = createMatrix(10, 20);
            const player = {
                pos: {x: 0, y: 0},
                matrix: null,
                next: null,
                score: 0,
                lines: 0,
                level: 1
            };

            // 키보드 이벤트 리스너 등록
            document.addEventListener('keydown', event => {
                if (gameOver) return;

                // 백스페이스나 화살표로 인해 브라우저 창이 스크롤되는 것 방지
                if([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
                    event.preventDefault();
                }

                if (event.keyCode === 37) { 
                    playerMove(-1);
                } else if (event.keyCode === 39) { 
                    playerMove(1);
                } else if (event.keyCode === 40) { 
                    playerDrop();
                } else if (event.keyCode === 38) { 
                    playerRotate(1);
                } else if (event.keyCode === 32) { 
                    playerHardDrop();
                }
                draw();
            });

            // 시작 버튼
            const startBtn = document.getElementById('start-btn');
            startBtn.addEventListener('click', () => {
                // 중요: 버튼 클릭 후 즉시 포커스 해제 (키보드 이벤트 꼬임 방지)
                startBtn.blur(); 

                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.lines = 0;
                player.level = 1;
                dropInterval = 1000;
                gameOver = false;
                player.next = null;
                
                playerReset();
                updateScore();
                lastTime = performance.now();
                update();
            });

            // 최초 화면 렌더링
            draw();
        });
    </script>
</body>
</html>
